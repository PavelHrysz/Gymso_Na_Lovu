<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Časovač 1 minuta</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('fonts/panton.black-caps.otf') format('otf'),
                 url('fonts/panton.black-caps.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: red;
            font-family: Arial, sans-serif;
            cursor: none;
                overflow: hidden;
        }

        /* Schování scrollbarů */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }
        .timer {
            font-size: 200px;
            font-weight: bold;
            font-family: 'MyCustomFont';
            color: white;
            z-index: 100;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }
        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <video autoplay muted loop>
        <source src="videa/pozadí.mp4" type="video/mp4">
        Váš prohlížeč nepodporuje video tag.
    </video>

    <div class="timer" id="timer">01:00</div>

    <script>
        const socket = io();
        let timeLeft = 60;
        let timerInterval;
        let isRunning = false;
        const timerDisplay = document.getElementById("timer");

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.textContent = "Konec!";
                isRunning = false;
            }
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft < 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                    }
                }, 1000);
            }
            socket.emit("minuta");
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 60;
            updateTimerDisplay();
        }

        socket.on("startTimer", () => {
            updateTimerDisplay();
            startTimer();
        });

        socket.on("pause", () => {
            pauseTimer();
            console.log("test");
        });

        socket.on("play", () => {
            startTimer();
        });

        socket.on("reset", () => {
            resetTimer();
            console.log("abcd")
        });

        socket.on("disconnect", () => {
            clearInterval(timerInterval);
            isRunning = false;
        });
    </script>
</body>
</html>
