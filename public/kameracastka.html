<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera + částka</title>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: none;
          overflow: hidden;
        }

        /* Schování scrollbarů */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
    }

    #video-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 0;
      transform: translate(-50%, -50%) scaleX(-1);
      object-fit: cover;
      background: transparent;
    }

    #box {
      position: relative;
      z-index: 10;
      width: 500px;
      height: 150px;
      background-color: rgba(15, 35, 90, 0.9);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence baseFrequency="0.75" numOctaves="4" seed="2" /></filter><rect width="100%" height="100%" fill="white" opacity="0.05" filter="url(%23noise)"/></svg>');
      color: white;
      font-size: 64px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid rgba(100, 220, 255, 1);
      border-radius: 15px;
      box-shadow: 
        inset 0 0 20px rgba(100, 220, 255, 0.2),
        0 0 15px rgba(100, 220, 255, 1),
        0 0 30px rgba(100, 220, 255, 0.8),
        0 0 45px rgba(100, 220, 255, 0.5),
        0 8px 32px rgba(0, 0, 0, 0.5);
      font-family: sans-serif;
      pointer-events: none;
      margin-top: 700px;
      text-shadow: 0 0 10px rgba(100, 220, 255, 0.8);
    }
  </style>
</head>
<body>

  <video id="video-bg" autoplay playsinline muted></video>
  <div id="box">0</div>

  <script>
    const video = document.getElementById('video-bg');
    const box = document.getElementById('box');
    
    const socket = io();

    socket.on("connect", () => {
        console.log("Kamera načtena, žádám o reset nahrané částky...");
        socket.emit("resetKameraCastka");
    });

    socket.on("numberInput", (data) => {
        box.textContent = Number(data.number).toLocaleString('cs-CZ');
    });
    // -----------------------------


    async function initCamera() {
        const constraints = {
            video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play().catch(e => console.error("Play failed:", e));
            };
        } catch (err) {
            console.error("Chyba kamery:", err);
            box.style.fontSize = "20px";
            box.textContent = "Kamera nedostupná";
        }
    }
    
    initCamera();
  </script>
</body>
</html>
