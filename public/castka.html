<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahraná celková částka</title>
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('fonts/panton.black-caps.otf') format('otf'),
                 url('fonts/panton.black-caps.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100%;
            overflow: hidden;
        }

        /* Schování scrollbarů */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'MyCustomFont', Arial, sans-serif;
            background: linear-gradient(135deg, 
                #0033cc 0%,
                #0044ff 10%,
                #001a80 30%,
                #000033 50%,
                #330022 65%,
                #660033 75%,
                #ff0033 85%,
                #ff0044 100%);
            background-attachment: fixed;
            overflow: hidden;
            cursor: none;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
        }

        .number-display {
            position: relative;
            z-index: 100;
            font-size: clamp(120px, 25vw, 400px);
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 
                0 0 20px rgba(0, 212, 255, 0.8),
                0 0 40px rgba(0, 212, 255, 0.4),
                4px 4px 20px rgba(0, 0, 0, 0.8);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            padding: clamp(30px, 8vw, 80px);
            border: 3px solid rgba(0, 212, 255, 0.6);
            border-radius: 30px;
            background: rgba(10, 50, 100, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 40px rgba(0, 212, 255, 0.5),
                0 0 80px rgba(0, 212, 255, 0.3),
                inset 0 0 30px rgba(0, 212, 255, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.6);
            animation: pulseNumber 2s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: clamp(200px, 40vw, 600px);
            min-height: clamp(200px, 40vw, 600px);
            transform: none;
        }

        @keyframes pulseNumber {
            0%, 100% {
                box-shadow: 
                    0 0 40px rgba(0, 212, 255, 0.5),
                    0 0 80px rgba(0, 212, 255, 0.3),
                    inset 0 0 30px rgba(0, 212, 255, 0.1),
                    0 20px 60px rgba(0, 0, 0, 0.6);
            }
            50% {
                box-shadow: 
                    0 0 60px rgba(0, 212, 255, 0.7),
                    0 0 120px rgba(0, 212, 255, 0.4),
                    inset 0 0 40px rgba(0, 212, 255, 0.15),
                    0 20px 60px rgba(0, 0, 0, 0.6);
            }
        }

        @media (max-width: 768px) {
            .number-display {
                font-size: clamp(80px, 20vw, 200px);
                padding: clamp(20px, 5vw, 50px);
                border-radius: 20px;
                min-width: clamp(150px, 35vw, 400px);
                min-height: clamp(150px, 35vw, 400px);
            }
        }

        @media (max-width: 480px) {
            .number-display {
                font-size: clamp(60px, 15vw, 120px);
                padding: clamp(15px, 4vw, 35px);
                border-radius: 15px;
                min-width: clamp(120px, 30vw, 300px);
                min-height: clamp(120px, 30vw, 300px);
            }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <video autoplay muted loop playsinline>
        <source src="videa/video_dvoubarevne.webm" type="video/webm">
        Váš prohlížeč nepodporuje video tag.
    </video>

    <div id="numberDisplay" class="number-display">0</div>

    <script>
    const socket = io();
    const numberDisplay = document.getElementById("numberDisplay");
    
    let currentDisplayValue = 0; // Tady držíme aktuální stav, co vidí uživatel
    let animationFrame;

    // Funkce pro hezké formátování s mezerami
    function formatNumber(num) {
        return Math.floor(num).toLocaleString('cs-CZ');
    }

    function animateValue(start, end, duration) {
        const startTime = performance.now();

        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Easing funkce (out-expo) - na konci zpomalí, vypadá to přirozeněji
            const easeOut = 1 - Math.pow(1 - progress, 3);
            
            const currentValue = start + (end - start) * easeOut;
            
            numberDisplay.textContent = formatNumber(currentValue);
            currentDisplayValue = currentValue;

            if (progress < 1) {
                animationFrame = requestAnimationFrame(update);
            } else {
                numberDisplay.textContent = formatNumber(end);
                currentDisplayValue = end;
            }
        }

        cancelAnimationFrame(animationFrame); // Zastaví předchozí animaci, pokud ještě běžela
        animationFrame = requestAnimationFrame(update);
    }

    socket.on("vyhra", (data) => {
        const targetValue = Number(data.number);
        console.log("Nová cílová částka:", targetValue);
        
        // Animujeme z aktuálního čísla na nové během 1500ms (1.5 sekundy)
        animateValue(currentDisplayValue, targetValue, 1500);
    });

    socket.on("vynulujCastku", () => {
        cancelAnimationFrame(animationFrame);
        currentDisplayValue = 0;
        numberDisplay.textContent = "0";
        console.log("vynulováno");
    });

    // Pro ruční testování v konzoli
    function zvysCastku(amount) {
        socket.emit("zvyscastku", { amount });
    }
</script>
    
</body> 
</html>
