<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otázky</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('fonts/panton.black-caps.otf') format('otf'),
                 url('fonts/panton.black-caps.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MyCustomFont', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: white;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(10px, 5vw, 30px);
            overflow: hidden;
            cursor: none;
                overflow: hidden;
        }

        /* Schování scrollbarů */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .question-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: min(95vw, 1200px);
            padding: clamp(20px, 5vw, 50px);
            background: rgba(15, 15, 35, 0.94);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid rgba(0, 200, 255, 0.3);
            box-shadow: 
                0 0 30px rgba(0, 200, 255, 0.4),
                0 8px 32px rgba(0, 0, 0, 0.6),
                inset 0 0 20px rgba(0, 200, 255, 0.1);
            animation: breatheNeon 3s ease-in-out infinite;
        }

        @keyframes breatheNeon {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(0, 200, 255, 0.4),
                    0 8px 32px rgba(0, 0, 0, 0.6),
                    inset 0 0 20px rgba(0, 200, 255, 0.1);
            }
            50% {
                box-shadow: 
                    0 0 40px rgba(0, 200, 255, 0.6),
                    0 8px 32px rgba(0, 0, 0, 0.6),
                    inset 0 0 25px rgba(0, 200, 255, 0.15);
            }
        }

        #question-text {
            font-size: clamp(24px, 8vw, 48px);
            margin-bottom: clamp(30px, 8vw, 60px);
            color: #00d4ff;
            text-shadow: 
                0 0 10px rgba(0, 212, 255, 0.8),
                2px 2px 20px rgba(0, 0, 0, 0.8);
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .answers-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(15px, 3vw, 25px);
            margin-bottom: clamp(20px, 5vw, 40px);
        }

        .answer-button {
            position: relative;
            padding: clamp(15px, 4vw, 30px);
            padding-right: clamp(50px, 10%, 80px);
            font-size: clamp(16px, 4vw, 28px);
            font-family: 'MyCustomFont', inherit;
            font-weight: 600;
            color: white;
            text-align: left;
            cursor: pointer;
            border: 3px solid rgba(100, 200, 255, 0.5);
            background: rgba(10, 50, 80, 0.7);
            border-radius: 15px;
            transition: all 0.3s ease;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            box-shadow: 
                0 0 15px rgba(100, 200, 255, 0.3),
                inset 0 0 10px rgba(0, 200, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: clamp(70px, 14vw, 120px);
        }

        .answer-button::before {
            content: '';
            position: absolute;
            left: -1px;
            top: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, #00d4ff, #64c8ff, #00d4ff);
            border-radius: 15px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .answer-button:hover {
            border-color: rgba(0, 212, 255, 0.8);
            background: rgba(20, 80, 120, 0.9);
            transform: translateY(-3px);
            box-shadow: 
                0 0 25px rgba(0, 212, 255, 0.6),
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 0 15px rgba(0, 200, 255, 0.1);
            letter-spacing: 0.5px;
        }

        .answer-button:hover::after,
        .answer-button:hover::before {
            opacity: 1 !important;
        }

        .answer-button:active {
            transform: translateY(-1px);
        }

        
        .answer-button.correct {
            border: 4px solid #00ff00 !important;
            background: rgba(0, 100, 0, 0.7) !important;
            box-shadow: 
                0 0 40px rgba(0, 255, 0, 0.9),
                0 0 80px rgba(0, 255, 0, 0.6),
                inset 0 0 25px rgba(0, 255, 0, 0.3) !important;
            animation: pulseGreen 0.6s ease-out;
            position: relative;
        }

        .answer-button.correct::after {
            content: 'SPRÁVNĚ';
            position: absolute;
            right: clamp(10px, 3%, 20px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 900;
            color: #00ff00;
            text-shadow: 
                0 0 10px #00ff00,
                0 0 20px #00ff00;
            letter-spacing: 1px;
            background: rgba(0, 50, 0, 0.8);
            padding: clamp(5px, 1vw, 10px) clamp(8px, 2vw, 12px);
            border-radius: 8px;
            border: 2px solid #00ff00;
            white-space: nowrap;
        }

        @keyframes pulseGreen {
            0% { 
                box-shadow: 
                    0 0 10px rgba(0, 255, 0, 0.4),
                    0 0 30px rgba(0, 255, 0, 0.2),
                    inset 0 0 10px rgba(0, 255, 0, 0.1);
            }
            100% { 
                box-shadow: 
                    0 0 30px rgba(0, 255, 0, 0.8),
                    0 0 60px rgba(0, 255, 0, 0.4),
                    inset 0 0 20px rgba(0, 255, 0, 0.2);
            }
        }

        
        .answer-button.selected-hrac {
            border: 4px solid #0099ff !important;
            background: rgba(0, 60, 120, 0.8) !important;
            box-shadow: 
                0 0 35px rgba(0, 153, 255, 0.85),
                0 0 70px rgba(0, 153, 255, 0.45),
                inset 0 0 20px rgba(0, 153, 255, 0.25) !important;
            animation: pulseBlue 0.5s ease-out;
            position: relative;
        }

        .answer-button.selected-hrac::after {
            content: 'HRÁČ';
            position: absolute;
            right: clamp(10px, 3%, 20px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(12px, 2.3vw, 18px);
            font-weight: 900;
            color: #0099ff;
            text-shadow: 
                0 0 8px #0099ff,
                0 0 16px #0099ff;
            letter-spacing: 0.5px;
            background: rgba(0, 40, 80, 0.9);
            padding: clamp(5px, 1vw, 10px) clamp(8px, 2vw, 12px);
            border-radius: 8px;
            border: 2px solid #0099ff;
            white-space: nowrap;
        }

        @keyframes pulseBlue {
            0% { 
                box-shadow: 
                    0 0 10px rgba(0, 153, 255, 0.4),
                    0 0 25px rgba(0, 153, 255, 0.2),
                    inset 0 0 10px rgba(0, 153, 255, 0.1);
            }
            100% { 
                box-shadow: 
                    0 0 25px rgba(0, 153, 255, 0.7),
                    0 0 50px rgba(0, 153, 255, 0.3),
                    inset 0 0 15px rgba(0, 153, 255, 0.15);
            }
        }

        /* LOVEC - NEON ORANŽOVÁ/ČERVENÁ */
        .answer-button.selected-lovec {
            border: 4px solid #ff6600 !important;
            background: rgba(150, 40, 0, 0.8) !important;
            box-shadow: 
                0 0 35px rgba(255, 102, 0, 0.85),
                0 0 70px rgba(255, 102, 0, 0.45),
                inset 0 0 20px rgba(255, 102, 0, 0.25) !important;
            animation: pulseOrange 0.5s ease-out;
            position: relative;
        }

        .answer-button.selected-lovec::after {
            content: 'LOVEC';
            position: absolute;
            right: clamp(10px, 3%, 20px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(12px, 2.3vw, 18px);
            font-weight: 900;
            color: #ff6600;
            text-shadow: 
                0 0 8px #ff6600,
                0 0 16px #ff6600;
            letter-spacing: 0.5px;
            background: rgba(100, 30, 0, 0.9);
            padding: clamp(5px, 1vw, 10px) clamp(8px, 2vw, 12px);
            border-radius: 8px;
            border: 2px solid #ff6600;
            white-space: nowrap;
        }

        @keyframes pulseOrange {
            0% { 
                box-shadow: 
                    0 0 10px rgba(255, 102, 0, 0.4),
                    0 0 25px rgba(255, 102, 0, 0.2),
                    inset 0 0 10px rgba(255, 102, 0, 0.1);
            }
            100% { 
                box-shadow: 
                    0 0 25px rgba(255, 102, 0, 0.7),
                    0 0 50px rgba(255, 102, 0, 0.3),
                    inset 0 0 15px rgba(255, 102, 0, 0.15);
            }
        }

        
        .answer-button.selected-hrac.correct {
            border: 4px solid #00ff00 !important;
            background: linear-gradient(135deg, rgba(0, 100, 0, 0.8), rgba(0, 60, 120, 0.8)) !important;
            box-shadow: 
                0 0 25px rgba(0, 255, 0, 0.8),
                0 0 50px rgba(0, 153, 255, 0.6),
                0 0 60px rgba(0, 255, 0, 0.3),
                inset 0 0 25px rgba(0, 255, 0, 0.2) !important;
            animation: pulseGreenBlue 0.6s ease-out !important;
            position: relative;
        }

        .answer-button.selected-hrac.correct::after {
            content: 'HRÁČ\A✓ SPRÁVNĚ';
            position: absolute;
            right: clamp(8px, 2%, 16px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(10px, 1.8vw, 15px);
            font-weight: 900;
            color: #00ceff;
            text-shadow: 
                0 0 8px #00ceff,
                0 0 15px #00ceff;
            letter-spacing: 0.3px;
            background: rgba(0, 30, 60, 0.95);
            padding: clamp(6px, 1.2vw, 12px) clamp(6px, 1.2vw, 10px);
            border-radius: 8px;
            border: 2px solid #00ceff;
            white-space: pre;
            text-align: center;
            line-height: 1.3;
            z-index: 10;
        }

        .answer-button.selected-hrac.correct::before {
            display: none;
        }

       
        .answer-button.selected-lovec.correct {
            border: 4px solid #00ff00 !important;
            background: linear-gradient(135deg, rgba(0, 100, 0, 0.8), rgba(150, 40, 0, 0.8)) !important;
            box-shadow: 
                0 0 25px rgba(0, 255, 0, 0.8),
                0 0 50px rgba(255, 102, 0, 0.6),
                0 0 60px rgba(0, 255, 0, 0.3),
                inset 0 0 25px rgba(0, 255, 0, 0.2) !important;
            animation: pulseGreenOrange 0.6s ease-out !important;
            position: relative;
        }

        .answer-button.selected-lovec.correct::after {
            content: 'LOVEC\A✓ SPRÁVNĚ';
            position: absolute;
            right: clamp(8px, 2%, 16px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(10px, 1.8vw, 15px);
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 
                0 0 8px #ffaa00,
                0 0 15px #ffaa00;
            letter-spacing: 0.3px;
            background: rgba(80, 30, 0, 0.95);
            padding: clamp(6px, 1.2vw, 12px) clamp(6px, 1.2vw, 10px);
            border-radius: 8px;
            border: 2px solid #ffaa00;
            white-space: pre;
            text-align: center;
            line-height: 1.3;
            z-index: 10;
        }

        .answer-button.selected-lovec.correct::before {
            display: none;
        }

        @keyframes pulseGreenBlue {
            0% { 
                box-shadow: 
                    0 0 10px rgba(0, 255, 0, 0.4),
                    0 0 20px rgba(0, 153, 255, 0.3),
                    inset 0 0 10px rgba(0, 255, 0, 0.1);
            }
            100% { 
                box-shadow: 
                    0 0 20px rgba(0, 255, 0, 0.8),
                    0 0 40px rgba(0, 153, 255, 0.5),
                    inset 0 0 20px rgba(0, 255, 0, 0.15);
            }
        }

        @keyframes pulseGreenOrange {
            0% { 
                box-shadow: 
                    0 0 10px rgba(0, 255, 0, 0.4),
                    0 0 20px rgba(255, 102, 0, 0.3),
                    inset 0 0 10px rgba(0, 255, 0, 0.1);
            }
            100% { 
                box-shadow: 
                    0 0 20px rgba(0, 255, 0, 0.8),
                    0 0 40px rgba(255, 102, 0, 0.5),
                    inset 0 0 20px rgba(0, 255, 0, 0.15);
            }
        }

        /* Všechny tři odpovědi na jednom místě */
        .answer-button.selected-hrac.selected-lovec.correct {
            border: 5px solid #00ff00 !important;
            background: linear-gradient(135deg, rgba(0, 100, 0, 0.9), rgba(0, 60, 120, 0.9), rgba(150, 40, 0, 0.9)) !important;
            box-shadow: 
                0 0 35px rgba(0, 255, 0, 1),
                0 0 70px rgba(0, 153, 255, 0.7),
                0 0 70px rgba(255, 102, 0, 0.7),
                inset 0 0 30px rgba(0, 255, 0, 0.3) !important;
            animation: pulseAllThree 0.6s ease-out !important;
            position: relative;
        }

        .answer-button.selected-hrac.selected-lovec.correct::after {
            content: 'HRÁČ\ALOVEC\A✓ SPRÁVNĚ';
            position: absolute;
            right: clamp(6px, 1.5%, 14px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(9px, 1.6vw, 13px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 0 6px #00ff00,
                0 0 6px #0099ff,
                0 0 6px #ff6600;
            letter-spacing: 0.2px;
            background: rgba(0, 20, 40, 0.95);
            padding: clamp(5px, 1vw, 10px) clamp(5px, 1vw, 9px);
            border-radius: 8px;
            border: 2px solid #00ff00;
            white-space: pre;
            text-align: center;
            line-height: 1.4;
            z-index: 10;
        }

        .answer-button.selected-hrac.selected-lovec.correct::before {
            display: none;
        }

        @keyframes pulseAllThree {
            0% { 
                box-shadow: 
                    0 0 20px rgba(0, 255, 0, 0.6),
                    0 0 30px rgba(0, 153, 255, 0.4),
                    0 0 30px rgba(255, 102, 0, 0.4),
                    inset 0 0 15px rgba(0, 255, 0, 0.15);
            }
            100% { 
                box-shadow: 
                    0 0 35px rgba(0, 255, 0, 1),
                    0 0 70px rgba(0, 153, 255, 0.7),
                    0 0 70px rgba(255, 102, 0, 0.7),
                    inset 0 0 30px rgba(0, 255, 0, 0.3);
            }
        }

        /* Hráč a lovec se liší v odpovědi */
        .answer-button.selected-hrac.selected-lovec {
            border: 4px solid #ffccff !important;
            background: linear-gradient(135deg, rgba(0, 60, 120, 0.8), rgba(150, 40, 0, 0.8)) !important;
            box-shadow: 
                0 0 30px rgba(0, 153, 255, 0.8),
                0 0 30px rgba(255, 102, 0, 0.8),
                0 0 60px rgba(255, 204, 255, 0.4),
                inset 0 0 20px rgba(255, 200, 255, 0.1) !important;
            animation: pulseBothWrong 0.5s ease-out;
            position: relative;
        }

        .answer-button.selected-hrac.selected-lovec::after {
            content: 'HRÁČ\ALOVEC';
            position: absolute;
            right: clamp(8px, 2%, 16px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(10px, 1.8vw, 15px);
            font-weight: 900;
            color: #ffaaff;
            text-shadow: 
                0 0 8px #ffaaff,
                0 0 15px #ffaaff;
            letter-spacing: 0.3px;
            background: rgba(60, 20, 60, 0.95);
            padding: clamp(6px, 1.2vw, 12px) clamp(6px, 1.2vw, 10px);
            border-radius: 8px;
            border: 2px solid #ffaaff;
            white-space: pre;
            text-align: center;
            line-height: 1.3;
            z-index: 10;
        }

        .answer-button.selected-hrac.selected-lovec::before {
            display: none;
        }

        @keyframes pulseBothWrong {
            0% { 
                box-shadow: 
                    0 0 15px rgba(0, 153, 255, 0.4),
                    0 0 15px rgba(255, 102, 0, 0.4),
                    inset 0 0 10px rgba(255, 200, 255, 0.05);
            }
            100% { 
                box-shadow: 
                    0 0 30px rgba(0, 153, 255, 0.8),
                    0 0 30px rgba(255, 102, 0, 0.8),
                    0 0 60px rgba(255, 204, 255, 0.4),
                    inset 0 0 20px rgba(255, 200, 255, 0.1);
            }
        }

        .wrong {
            border: 3px solid #ff4444 !important;
            background: rgba(150, 0, 0, 0.4) !important;
            box-shadow: 
                0 0 20px rgba(255, 68, 68, 0.6),
                inset 0 0 15px rgba(255, 68, 68, 0.1) !important;
        }

        #result {
            position: relative;
            z-index: 1;
            font-size: clamp(18px, 4vw, 26px);
            margin-top: clamp(20px, 5vw, 40px);
            padding: clamp(15px, 3vw, 25px);
            min-height: 50px;
            text-align: center;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
        }

       
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .question-container {
                padding: clamp(15px, 4vw, 30px);
                border-radius: 15px;
            }

            .answer-button {
                padding: clamp(12px, 3vw, 25px);
                font-size: clamp(14px, 3.5vw, 22px);
                min-height: clamp(55px, 10vw, 85px);
                border-radius: 12px;
            }
        }

        @media (max-width: 480px) {
            #question-text {
                font-size: clamp(18px, 6vw, 32px);
                margin-bottom: clamp(20px, 6vw, 40px);
            }

            .answer-button {
                font-size: clamp(13px, 3vw, 18px);
                padding: clamp(10px, 2.5vw, 20px);
                min-height: clamp(50px, 9vw, 75px);
            }
        }

        @media (max-width: 320px) {
            #question-text {
                font-size: 16px;
            }

            .answer-button {
                font-size: 12px;
                padding: 10px;
                min-height: 50px;
                border-radius: 10px;
            }
        }

       
        @media (max-height: 600px) {
            .question-container {
                padding: clamp(15px, 3vw, 30px);
                margin: 15px 0;
            }

            #question-text {
                margin-bottom: clamp(15px, 3vh, 30px);
            }

            .answers-container {
                gap: clamp(10px, 2vh, 15px);
            }

            .answer-button {
                min-height: clamp(50px, 8vh, 70px);
            }
        }
    </style>
</head>
<body>
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="videa/barvy_pozadi.mp4" type="video/mp4">
        Váš prohlížeč nepodporuje video prvek.
    </video>
    <div class="question-container">
        <div id="question-text">Čekám na otázku...</div>
        <div class="answers-container">
            <div id="answer-1" class="answer-button" data-option="A">-</div>
            <div id="answer-2" class="answer-button" data-option="B">-</div>
            <div id="answer-3" class="answer-button" data-option="C">-</div>
        </div>
    </div>
    <p id="result"></p>

    <script>
    const socket = io();
    let questions = [];
    let currentQuestionIndex = 0;
    let correctAnswer = "";
    let hracAnswer = "";
    let lovecAnswer = "";
    let hracOdpovedZobrazeno = false;
    let lovecOdpovedZobrazeno = false;
    let spravnaOdpovedZobrazeno = false;

    socket.on("connect", () => {
        console.log("Připojeno k serveru, žádám o data...");
        socket.emit("dejMiVsechnyOtazky"); 
        socket.emit("dejMiAktualniIndex");
    });

    socket.on("posilamVsechnyOtazky", (data) => {
        console.log("Data přijata ze serveru (posilamVsechnyOtazky):", data);
        questions = data; 
        displayQuestion();
    });

    socket.on("otazkyNacteny", (data) => {
        console.log("Data přijata (otazkyNacteny):", data);
        questions = data; 
        displayQuestion();
    });

    socket.on("posilamAktualniIndex", (index) => {
        console.log("Přijat index:", index);
        currentQuestionIndex = index;
        displayQuestion();
    });

    socket.on("dalsiOtazka", (index) => {
        console.log("Změna na index:", index);
        currentQuestionIndex = index;
        resetButtons();
        displayQuestion();
    });

    socket.on("syncCorrectAnswer", (data) => {
        if (data && data.correctAnswer) {
            correctAnswer = data.correctAnswer;
            console.log("[Server] Správná odpověď ze serveru:", correctAnswer);
        }
    });

    socket.on("hrac", (data) => {
        hracAnswer = data;
        console.log("Hráč vybral: ", data);
    });

    socket.on("lovec", (data) => {
        lovecAnswer = data;
        console.log("Lovec vybral: ", data);
    });

    socket.on("odpovedhrac", () => {
        highlightAnswer(hracAnswer, "selected-hrac");
        hracOdpovedZobrazeno = true;
        console.log("[UI] Zobrazuji odpověď hráče:", hracAnswer);
    });

    socket.on("odpovedlovec", () => {
        highlightAnswer(lovecAnswer, "selected-lovec");
        lovecOdpovedZobrazeno = true;
        console.log("[UI] Zobrazuji odpověď lovce:", lovecAnswer);
    });

    socket.on("ukazzpravnou", () => {
        highlightAnswer(correctAnswer, "correct");
        spravnaOdpovedZobrazeno = true;
        console.log("[UI] Zobrazuji správnou odpověď:", correctAnswer);
    });

    function displayQuestion() {
    if (!questions || questions.length === 0) {
        console.warn("displayQuestion: Pole questions je prázdné.");
        return;
    }

    const q = questions[currentQuestionIndex];
    if (!q) return;

    console.log("Zobrazuji surová data:", q);

    // --- DETEKCE FORMÁTU ---
    
    if (Array.isArray(q)) {
        document.getElementById("question-text").textContent = q[0];
        for (let i = 1; i <= 3; i++) {
            const btn = document.getElementById(`answer-${i}`);
            if (btn) btn.textContent = q[i] || "-";
        }
        correctAnswer = "A"; 
    } 
    
    else if (q.question && q.answers) {
        document.getElementById("question-text").textContent = q.question;
        q.answers.forEach((ans, index) => {
            const btn = document.getElementById(`answer-${index + 1}`);
            if (btn) {
                btn.textContent = (typeof ans === 'object') ? ans.text : ans;
                if (ans.isCorrect || ans.correct) {
                    correctAnswer = ["A", "B", "C"][index];
                }
            }
        });
    }

    // Zavoláme kontrolu velikosti textu
    setTimeout(fitTextToContainer, 50);
}

function fitTextToContainer() {
    const questionText = document.getElementById("question-text");
    const container = document.querySelector(".question-container");
    
    if (!questionText || !container) return;

    let fontSize = parseFloat(window.getComputedStyle(questionText).fontSize);
    const minFontSize = 16; // Minimální zdопustná velikost fontu v pixelech
    const maxHeight = window.innerHeight * 0.85; // 85% výšky obrazovky

    // Resetuj na výchozí velikost (48px nebo maximální ze clamp)
    questionText.style.fontSize = "";
    
    // Zkontroluj, jestli se vejde
    while (container.scrollHeight > maxHeight && fontSize > minFontSize) {
        fontSize -= 2;
        questionText.style.fontSize = fontSize + "px";
    }
}

    function highlightAnswer(option, className) {
        document.querySelectorAll(".answer-button").forEach(btn => {
            if (btn.getAttribute("data-option") === option) {
                btn.classList.add(className);
            }
        });
    }

    function resetButtons() {
        document.querySelectorAll(".answer-button").forEach(btn => {
            btn.classList.remove("correct", "wrong", "selected-hrac", "selected-lovec");
        });
        hracAnswer = "";
        lovecAnswer = "";
        hracOdpovedZobrazeno = false;
        lovecOdpovedZobrazeno = false;
        spravnaOdpovedZobrazeno = false;
    }
</script>
