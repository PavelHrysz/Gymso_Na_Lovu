<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projektor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            cursor: none;
        }

        /* Schování scrollbarů */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #scene-transition-overlay {
            position: fixed;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00d2ff 30%, 
                #fff 50%, 
                #ff003e 70%, 
                transparent 100%
            );
            transform: skewX(-30deg); 
            opacity: 0;
        }

        .trigger-wipe {
            animation: sharp-stinger 0.3s ease-in-out forwards;
        }

        @keyframes sharp-stinger {
            0% { left: -150%; opacity: 1; }
            50% { opacity: 1; }
            100% { left: 150%; opacity: 1; }
        }
        * { cursor: none !important; }
    </style>
</head>
<body>
    <div id="scene-transition-overlay"></div>
    <iframe id="sceneFrame" src=""></iframe>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const iframe = document.getElementById("sceneFrame");
        const overlay = document.getElementById('scene-transition-overlay');
        
        let currentSrc = "";
        let cislo = 0;
        let timerSound = null;
        let timerSoundCurrentTime = 0;
        let timerSoundFile = "";

        function playTransition(callback) {
        const overlay = document.getElementById('scene-transition-overlay');
        overlay.classList.remove('trigger-wipe');
        void overlay.offsetWidth;
        overlay.classList.add('trigger-wipe');
        
        if (callback) {
            setTimeout(callback, 180); 
        }
    }

        function playTransition(callback) {
            overlay.classList.remove('trigger-wipe');
            void overlay.offsetWidth; 
            overlay.classList.add('trigger-wipe');
            
            if (callback) {
                setTimeout(callback, 150); 
            }
        }

        socket.on("sceneUpdate", (mapping) => {
            if (mapping && mapping.index1) {
                const newSrc = mapping.index1;
                if (newSrc !== currentSrc) {
                    playTransition(() => {
                        iframe.src = newSrc;
                        currentSrc = newSrc;
                    });
                }
            }
        });

let activeAudios = [];

function playSound(file) {
    try {
        const audio = new Audio(file);
        activeAudios.push(audio);
        
        audio.play().catch(e => console.error("Chyba přehrávání zvuku (asi Autoplay block):", e));
        
        audio.onended = () => {
            activeAudios = activeAudios.filter(a => a !== audio);
        };
    } catch (e) {
        console.error("Chyba vytvoření audia:", e);
    }
}

socket.on("stopAudio", () => {
    console.log("Zastavuji všechny zvuky...");
    activeAudios.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });
    activeAudios = [];
});

        function stopTimerSound() {
            if (timerSound) {
                timerSoundCurrentTime = timerSound.currentTime;
                timerSound.pause();
            }
        }

        function resumeTimerSound() {
            if (timerSound) {
                timerSound.play().catch(e => console.error("Audio error:", e));
                timerSound.currentTime = timerSoundCurrentTime;
            }
        }

        function playTimerSound(soundFile) {
            stopTimerSound();
            timerSoundFile = soundFile;
            if (!timerSound) {
                timerSound = new Audio(soundFile);
                timerSound.src = timerSoundFile;
                timerSound.addEventListener('canplaythrough', () => {
                    timerSound.play().catch(e => console.error("Audio error:", e));
                });
            } else {
                timerSound.play().catch(e => console.error("Audio error:", e));
            }
        }

        socket.on("dalsiOtazka", () => playSound('hudba/otazka.mp3'));
        socket.on("odpovedhrac", () => playSound('hudba/lovec.mp3'));
        socket.on("odpovedlovec", () => playSound('hudba/hrac.mp3'));
        socket.on("ukazzpravnou", () => playSound('hudba/dobra.mp3'));
        socket.on("hrac", () => playSound('hudba/lovecodpoved.mp3'));
        socket.on("lovec", () => playSound('hudba/hracodpoved.mp3'));
        socket.on("timerStarted2m", () => playTimerSound('hudba/2min.mp3'));
        socket.on("play", resumeTimerSound);
        socket.on("pause", stopTimerSound);
        socket.on("minuta", () => playSound('hudba/minuta.mp3'));
        socket.on("uvodniznelka", () => playSound('hudba/zacatek.mp3'));
        socket.on("lovecprichazi", () => playSound('hudba/lovecprichazi.mp3'));
        socket.on("konec", () => playSound('hudba/konec.mp3'));
        socket.on("dalsihrac", () => playSound('hudba/dalsihrac.mp3'));
        socket.on("petvterin", () => playSound('hudba/5vterin.mp3'));
        socket.on("vypln1", () => playSound('hudba/vypln1.mp3'));
        socket.on("vypln2", () => playSound('hudba/vypln2.mp3'));
        socket.on("vypln3", () => playSound('hudba/vypln3.mp3'));
        socket.on("prohrals", () => playSound('hudba/lovecvyhra.mp3'));
        socket.on("hracvyhrazebrik", () => {
            playSound('hudba/hracvyhra.mp3');
            console.log("[Frontend] Přijat event ze serveru: Hráč vítězí!");
        });
        socket.on("addbox", () => playSound('hudba/hracipole.mp3'));
        socket.on("changecolor", () => playSound('hudba/lovepole.mp3'));
        
        socket.on("lovecvyhra", () => {
            cislo += 1;
            if (cislo == 1) playSound('hudba/lovecvyhra.mp3');
        });

        socket.on("zebrikCommand", (data) => {
            if (data.command === "changeImage1") playSound('hudba/hracpohyb.mp3');
            else if (data.command === "changeImage2") playSound('hudba/lovecpohyb.mp3');
        });

        socket.on("playSound", (data) => {
            try {
                if (data && data.sound) {
                    const map = {
                        playerWin: 'hudba/hracvyhra.mp3',
                        hunterWin: 'hudba/lovecvyhra.mp3',
                        playerMove: 'hudba/hracpohyb.mp3',
                        hunterMove: 'hudba/lovecpohyb.mp3'
                    };
                    const file = map[data.sound] || data.sound;
                    playSound(file);
                }
            } catch (e) { console.error('playSound handler error', e); }
        });


        socket.on('playerReached', (info) => {
            playSound('hudba/hracvyhra.mp3');
        });

        socket.on('hunterReached', () => {
            playSound('hudba/lovecvyhra.mp3');
        });

        socket.on("finaleCommand", (data) => {
            if (data.command === "addBox") playSound('hudba/hracipole.mp3');
            else if (data.command === "changeColor") playSound('hudba/lovecvyhra3kolo.mp3');
            console.log("zvukyfinale")
        });

        // Proměnná pro uchování aktuálního profilu
let currentProfile = "nizsi";

// Zachycení změny profilu ze serveru
socket.on("profileUpdate", (profil) => {
    currentProfile = profil;
    console.log("[Index1] Aktualizován profil pro zvuky:", currentProfile);
});

// Mapa všech 15 zvukových efektů (3 profily x 5 stolů)
// Uprav si cesty ke zvukovým souborům tak, jak je máš uložené ve složce public/hudba/
const buttonSounds = {
    nizsi: {
        1: 'hudba/hraci/nizsi_stul1.mp3',
        2: 'hudba/hraci/nizsi_stul2.mp3',
        3: 'hudba/hraci/nizsi_stul3.mp3',
        4: 'hudba/hraci/nizsi_stul4.mp3',
        5: 'hudba/hraci/nizsi_stul5.mp3'
    },
    vyssi: {
        1: 'hudba/hraci/vyssi_stul1.mp3',
        2: 'hudba/hraci/vyssi_stul2.mp3',
        3: 'hudba/hraci/vyssi_stul3.mp3',
        4: 'hudba/hraci/vyssi_stul4.mp3',
        5: 'hudba/hraci/vyssi_stul5.mp3'
    },
    ucitele: {
        1: 'hudba/hraci/ucitele_stul1.mp3',
        2: 'hudba/hraci/ucitele_stul2.mp3',
        3: 'hudba/hraci/ucitele_stul3.mp3',
        4: 'hudba/hraci/ucitele_stul4.mp3',
        5: 'hudba/hraci/ucitele_stul5.mp3'
    }
};

// Vytvoření posluchačů pro všech 5 stolů v jednom cyklu
for (let i = 1; i <= 5; i++) {
    socket.on(`stisknutoHrac${i}`, (data) => {
        // Vyhledáme zvuk v mapě podle aktuálního profilu a čísla stolu
        const soundToPlay = buttonSounds[currentProfile] && buttonSounds[currentProfile][i];
        
        if (soundToPlay) {
            console.log(`[Index1] Přehrávám zvuk tlačítka: Stůl ${i}, Profil: ${currentProfile}`);
            playSound(soundToPlay);
        } else {
            console.warn(`[Index1] Zvuk pro stůl ${i} a profil ${currentProfile} nenalezen!`);
        }
    });
}
    </script>
</body>
</html>
