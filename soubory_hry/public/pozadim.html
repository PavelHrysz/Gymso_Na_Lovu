<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video na pozadí</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100%;
            overflow: hidden;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: black;
            cursor: none;
                overflow: hidden;
        }

        /* Schování scrollbarů */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <video autoplay muted loop>
        <source src="videa/pozadi text.mov" type="video/mp4">
        Váš prohlížeč nepodporuje video tag.
    </video>
</body>
</html>
