<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na Lovu - Master Controller</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --panel-bg: rgba(20, 25, 35, 0.95);
            --accent-blue: #00d4ff;
            --accent-gold: #ffcc00;
            --accent-red: #ff3333;
            --accent-green: #2ecc71;
            --text-light: #e0e0e0;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1a2030 0%, #0a0b10 100%);
            font-family: 'Roboto', sans-serif;
            color: var(--text-light);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            
        }

        h2, h3 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: var(--accent-blue);
            font-size: 1.1rem;
            border-bottom: 1px solid var(--glass);
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--glass);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* Tlačítka */
        button {
            width: 100%;
            padding: 12px 15px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active { transform: translateY(0); }

        /* Barevné třídy pro tlačítka */
        .btn-primary { background: linear-gradient(135deg, #0051ff, #00d4ff); border-bottom: 3px solid #003dbb; }
        .btn-success { background: linear-gradient(135deg, #1e7d32, #2ecc71); border-bottom: 3px solid #145a25; }
        .btn-danger { background: linear-gradient(135deg, #b31217, #ff3333); border-bottom: 3px solid #7a0d10; }
        .btn-warning { background: linear-gradient(135deg, #c08d00, #ffcc00); color: #000; font-weight: 900; border-bottom: 3px solid #8a6500; }
        .btn-special { background: linear-gradient(135deg, #6a11cb, #2575fc); border-bottom: 3px solid #4a0da3; }
        .btn-grey { background: linear-gradient(135deg, #292929, #575757); border-bottom: 3px solid #272727; }

        /* Numpad */
        .numpad-container {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
        }

        #numDisplay {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--accent-gold);
            text-align: right;
            background: #000;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 10px;
            min-height: 40px;
            border: 1px solid var(--accent-gold);
            box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.2);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .numpad button {
            height: 50px;
            font-size: 18px;
            background: #222;
        }

        .numpad .zero { grid-column: span 1; }
        .numpad .triple-zero { background: #333; font-size: 14px; }

        /* Status Stoly */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr;
            width: 100%;
            gap: 5px;
        }

        .status-item {
            padding: 10px;
            background: #1a1a1a;
            border-left: 4px solid #444;
            font-size: 13px;
            text-align: left;
            border-radius: 4px;
            transition: all 0.5s;
        }

        .active-stul {
            background: #2c1a00 !important;
            border-left-color: var(--accent-gold) !important;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        #scene-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .config-box {
            background: rgba(255,0,0,0.1);
            border: 1px solid var(--accent-red);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Styl pro aktivní profil */
.active-profile {
    border: 2px solid var(--accent-gold) !important;
    box-shadow: 0 0 15px rgba(255, 204, 0, 0.4) !important;
    background: linear-gradient(135deg, #444, #222) !important;
    color: var(--accent-gold) !important;
    font-weight: bold;
}

    </style>
</head>
<body>

<div class="panel">
    <h2>Systém & Profily</h2>
    <div class="config-box">
        <button class="btn-danger" onclick="socket.emit('syncVsechnoZGoogle')">☁️ Synchronizovat Cloud</button>
    </div>
    
    <h3>Výběr Profilu</h3>
    <button class="btn-profil" onclick="nastavProfil(this, 'nizsi')">🎓 Nižší Gympl</button>
    <button class="btn-profil" onclick="nastavProfil(this, 'vyssi')">🎓 Vyšší Gympl</button>
    <button class="btn-profil" onclick="nastavProfil(this, 'ucitele')">👨‍🏫 Učitelé</button>
    
    <div style="margin-top: 20px; width: 100%;">
        <button class="btn-success" onclick="nacistOffline()">📂 Načíst Offline soubor</button>
        <button class="btn-danger" onclick="socket.emit('resetujRychleOtazky')">🔄 Reset 1. kola (Rychlé)</button>
        <button class="btn-danger" onclick="socket.emit('resetOtazek')">🔄 Reset 2. kola (ABC)</button>
        <button class="btn-danger" onclick="socket.emit('resetujFinale')">🔄 Reset 3. kola (Finále)</button>
        <button class="btn-danger" onclick="resetNahranaCastka()" style="margin-top: 8px;">🔄 Reset Nahraných Peněz</button>
        <button class="btn-primary" onclick="socket.emit('reloadCastka')" style="margin-top: 8px;">🔄 Znovu načíst částku ze souboru</button>
    </div>
</div>

<div class="panel">
    <h2>Otázky & Hra</h2>
    <button class="btn-primary" onclick="sendAnswerHrac()">👤 Odpověď Hráč</button>
    <button class="btn-warning" onclick="sendCorrectAnswer()">✅ Správná Odpověď</button>
    <button class="btn-danger" onclick="sendAnswerLovec()">🕵️ Odpověď Lovec</button>
    <button class="btn-special" style="margin-top: 15px;" onclick="dalsiOtazka()">➡️ Další Otázka</button>

    <h2 style="margin-top: 25px;">Časovač</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;">
        <button class="btn-success" onclick="startTimer()">Start</button>
        <button class="btn-danger" onclick="pause()">Pauza</button>
        <button class="btn-primary" onclick="play()">Pokračovat</button>
        <button class="btn-warning" onclick="reset()">Reset</button>
    </div>

    <div style="margin-top: 15px; width: 100%; border-top: 1px solid var(--glass); padding-top: 10px;">
        <h2>1. Kolo</h2>
        <button class="btn-success" onclick="zvyscastku()">zvyš částku</button>
        <button class="btn-danger" onclick="snizcastku()">snížit částku</button>
    </div>

</div>

<div class="panel">
    <h2>Finance & Nabídky</h2>
    <div id="numDisplay">0</div>
    
    <div class="numpad-container">
        <div class="numpad" id="numpad"></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 15px;">
        <button class="btn-success" onclick="sendNumber()">Poslat Základ</button>
        <button class="btn-danger" onclick="vynuluj()">Vynulovat</button>
        <button class="btn-warning" onclick="sendHigherAmount()">Poslat Vyšší</button>
        <button class="btn-primary" onclick="sendLowerAmount()">Poslat Nižší</button>
    </div>

    <h3 style="font-size: 0.9rem; margin-top: 10px;">Aktivovat na žebříku</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; border: 1px solid var(--glass); padding: 10px; border-radius: 8px;">
        <button class="btn-primary" style="font-size: 11px;" onclick="Amounttype('lower')">Vybral NIŽŠÍ</button>
        <button class="btn-success" style="font-size: 11px;" onclick="Amounttype('middle')">Vybral ZÁKLAD</button>
        <button class="btn-warning" style="font-size: 11px;" onclick="Amounttype('higher')">Vybral VYŠŠÍ</button>
    </div>

    <!-- Debug žebřík -->
    <h3 style="margin-top:18px;">Debug Žebřík</h3>
    <div style="display:flex; gap:8px; width:100%; margin-bottom:10px;">
        <button class="btn-primary" onclick="sendPlayerStep()">Hráč pohyb ↓</button>
        <button class="btn-danger" onclick="sendHunterStep()">Lovec pohyb ↑</button>
        <button class="btn-warning" onclick="resetPlayerWin()">Reset win</button>
    </div>
    <div style="width:100%; text-align:center; font-size:14px; color:var(--accent-gold);">
        Stav žebříku: <span id="ladderState">—</span>
    </div>
</div>

<div class="panel">
    <h2>Scény & Režie</h2>
    <div id="scene-buttons">
        </div>

    <h3 style="margin-top: 20px;">Finále / Boxy</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;">
        <button class="btn-primary" onclick="sendFinaleCommand('addBox')">Pole Hráč</button>
        <button class="btn-grey" onclick="sendFinaleCommand('removeBox')">Oprava hráč</button>
        <button class="btn-danger" onclick="sendFinaleCommand('changeColor')">Pole Lovec</button>
        <button class="btn-grey" onclick="sendFinaleCommand('changeColorBack')">Oprava Lovec</button>
    </div>
</div>

<div class="panel">
    <h2>Audio & Efekty</h2>
    <button class="btn-special" onclick="uvodniznelka()">🎵 Úvodní Znělka</button>
    <button class="btn-special" onclick="lovecprichazi()">🕵️ Příchod Lovce</button>
    <button class="btn-special" onclick="petvterin()">⏳ 5 vteřin</button>
    <button class="btn-warning" onclick="dalsihrac()">👤 Další Hráč</button>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; width: 100%; margin: 10px 0;">
        <button onclick="vypln1()">V1</button>
        <button onclick="vypln2()">V2</button>
        <button onclick="vypln3()">V3</button>
    </div>

    <button class="btn-danger" onclick="konec()">🏁 KONEC Hry</button>

    <button onclick="stopAudio()" style="background-color: #ff3333; color: white; padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px;">
    🛑 ZASTAVIT VŠECHNY ZVUKY
</button>

    <h3 style="margin-top: 20px;">Stav Stolů</h3>
    <div class="status-grid">
        <div id="status-stul1" class="status-item">Stůl 1: OFFLINE</div>
        <div id="status-stul2" class="status-item">Stůl 2: OFFLINE</div>
        <div id="status-stul3" class="status-item">Stůl 3: OFFLINE</div>
        <div id="status-stul4" class="status-item">Stůl 4: OFFLINE</div>
        <div id="status-stul5" class="status-item">Stůl 5: OFFLINE</div>
    </div>
</div>

<script>
    const socket = io();
    let numInput = "";
    const numDisplay = document.getElementById("numDisplay");

    // --- LOGIKA NUMPADU ---
    const numpad = document.getElementById("numpad");
    for (let i = 1; i <= 9; i++) {
        const btn = document.createElement("button");
        btn.innerText = i;
        btn.onclick = () => appendNumber(i);
        numpad.appendChild(btn);
    }
    // Nula
    const zeroBtn = document.createElement("button");
    zeroBtn.innerText = "0";
    zeroBtn.onclick = () => appendNumber("0");
    numpad.appendChild(zeroBtn);

    // Trojitá nula
    const tripleZeroBtn = document.createElement("button");
    tripleZeroBtn.innerText = "000";
    tripleZeroBtn.classList.add("triple-zero");
    tripleZeroBtn.onclick = () => appendNumber("000");
    numpad.appendChild(tripleZeroBtn);

    function appendNumber(num) {
        numInput += num;
        let val = parseInt(numInput) || 0;
        numDisplay.textContent = val.toLocaleString('cs-CZ');
    }

    function vynuluj() {
        numInput = "";
        numDisplay.textContent = "0";
    }

    function resetNahranaCastka() {
        if(confirm("Opravdu resetovat nahranou částku ze souboru?")) {
            socket.emit("vynulujCastku");
            console.log("Nahraná částka resetována");
        }
    }

    function stopAudio() { 
    socket.emit("stopAudio"); 
}

    function nastavProfil(element, profilId) {
    // 1. Najdi všechna tlačítka profilů a odeber jim aktivní třídu
    const profilButtons = document.querySelectorAll('.btn-profil');
    profilButtons.forEach(btn => btn.classList.remove('active-profile'));

    // 2. Přidej aktivní třídu na to, na které se kliklo
    element.classList.add('active-profile');

    // 3. Odešli socket signál jako předtím
    socket.emit('nastavProfilOffline', profilId);
    
    console.log(`Profil přepnut na: ${profilId}`);
}

    // --- LOGIKA SCÉN ---
    const sceny = {
        "Úvodní": "scene1",
        "Výplň": "scene2",
        "1. Kolo": "scene3",
        "Žebřík (OFF)": "scene4",
        "Žebřík (ON)": "scene5",
        "Finále": "scene6",
        "Debug": "debug"
    };

    const sceneContainer = document.getElementById("scene-buttons");
    for (const [text, id] of Object.entries(sceny)) {
        const btn = document.createElement("button");
        btn.innerText = text;
        btn.onclick = () => zmenScenu(id);
        sceneContainer.appendChild(btn);
    }

    // --- KOMUNIKAČNÍ FUNKCE ---
    function sendAnswerHrac() { socket.emit("odpovedhrac"); }
    function sendAnswerLovec() { socket.emit("odpovedlovec"); }
    function sendCorrectAnswer() { socket.emit("ukazzpravnou"); }
    function dalsiOtazka() { socket.emit("dalsiOtazka"); }
    
    function startTimer() { socket.emit("startTimer"); }
    function pause() { socket.emit("pause"); }
    function play() { socket.emit("play"); }
    function reset() { socket.emit("reset"); }

    function sendNumber() { socket.emit("numberInput", { number: numInput }); numInput = ""; numDisplay.textContent = "0"; }
    function sendHigherAmount() { socket.emit("higherAmount", { number: numInput }); numInput = ""; numDisplay.textContent = "0"; }
    function sendLowerAmount() { socket.emit("lowerAmount", { number: numInput }); numInput = ""; numDisplay.textContent = "0"; }

    function Amounttype(type) { socket.emit("amountType", { type: type }); }
    
    function zvyscastku() { socket.emit("zvyscastku"); }
    function snizcastku() { socket.emit("snizcastku"); }
    function zmenScenu(preset) { socket.emit("changeScene", { preset }); }
    function sendFinaleCommand(command) { socket.emit("finaleCommand", { command }); }

    // Audio triggery
    function uvodniznelka() { socket.emit("uvodniznelka"); }
    function lovecprichazi() { socket.emit("lovecprichazi"); }
    function konec() { socket.emit("konec"); }
    function dalsihrac() { socket.emit("dalsihrac"); }
    function petvterin() { socket.emit("petvterin"); }
    function vypln1() { socket.emit("vypln1"); }
    function vypln2() { socket.emit("vypln2"); }
    function vypln3() { socket.emit("vypln3"); }

    function nacistOffline() { socket.emit("nactiLokalniOtazky"); }
    function resetOtazek() { if(confirm("Opravdu resetovat otázky?")) socket.emit("resetujRychleOtazky"); }

    // --- Debug ladder controls ---
    function sendPlayerStep() { socket.emit('zebrikCommand', { command: 'changeImage1' }); }
    function sendHunterStep() { socket.emit('zebrikCommand', { command: 'changeImage2' }); }
    function resetPlayerWin() { socket.emit('playerReset'); socket.emit('zebrikCommand', { command: 'reset' }); }

    socket.on('ladderState', (state) => {
        const el = document.getElementById('ladderState');
        if (!el) return;
        el.textContent = `hráč:${state.playerLevel} lovec:${state.hunterLevel}`;
    });

    // --- SOCKET LISTENERS (Stoly) ---
    [1, 2, 3, 4, 5].forEach(id => {
        socket.on(`stisknutoHrac${id}`, () => {
            const radek = document.getElementById(`status-stul${id}`);
            if (radek) {
                radek.classList.add('active-stul');
                radek.innerText = `Stůl ${id}: BUZZER!`;
                setTimeout(() => {
                    radek.classList.remove('active-stul');
                    radek.innerText = `Stůl ${id}: PŘIPRAVEN`;
                }, 2000);
            }
        });
    });

    socket.on("connect", () => console.log("Controller Online"));
</script>
</body>
</html>
