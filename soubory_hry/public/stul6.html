<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stůl 6</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s ease;
        }
        .main-card {
            text-align: center;
            padding: 50px;
            border: 4px solid #333;
            border-radius: 30px;
            width: 80%;
            transition: all 0.3s ease;
        }
        .name { font-size: 10vw; font-weight: 900; margin: 0; letter-spacing: 5px; }
        .status { font-size: 2vw; color: #666; text-transform: uppercase; margin-top: 20px; }
        
        .active-bg { background-color: #00ccff !important; }
        .active-card { border-color: #fff !important; transform: scale(1.05); box-shadow: 0 0 100px rgba(255, 215, 0, 0.8); }
        .active-text { color: black !important; }
    </style>
</head>
<body id="bg">
    <div class="main-card" id="card">
        <h1 class="name">STŮL 6</h1>
        <div class="status" id="status">PŘIPRAVEN KE HŘE</div>
    </div>

    <script>
        const socket = io();
        const mojeId = 6;

        let currentProfile = "nižší";
        let stolyData = {};

        socket.on('connect', () => console.log("Spojení navázáno pod ID: " + socket.id));


        function normalizeString(str) {
            if (!str) return '';
            return str
                .toLowerCase()
                .replace(/[áàâäă]/g, 'a')
                .replace(/[éèêëě]/g, 'e')
                .replace(/[íìîï]/g, 'i')
                .replace(/[óòôöœ]/g, 'o')
                .replace(/[úùûüů]/g, 'u')
                .replace(/[ýŷ]/g, 'y')
                .replace(/[č]/g, 'c')
                .replace(/[ď]/g, 'd')
                .replace(/[ň]/g, 'n')
                .replace(/[ř]/g, 'r')
                .replace(/[š]/g, 's')
                .replace(/[ť]/g, 't')
                .replace(/[ž]/g, 'z');
        }


        socket.on("stolyDataUpdate", (data) => {
            console.log("[Socket] Přijata data stolů:", data);
            stolyData = data;
            

            const availableProfiles = Object.keys(stolyData);
            console.log(`[Socket] Normalizuji profil '${currentProfile}' proti:`, availableProfiles);
            
            const profileKey = availableProfiles.find(key => {
                const normalizedKey = normalizeString(key);
                const normalizedProfile = normalizeString(currentProfile);
                console.log(`[Socket] Porovnávám: '${normalizedKey}' === '${normalizedProfile}'`);
                return normalizedKey === normalizedProfile;
            });
            
            if (profileKey) {
                currentProfile = profileKey;
                console.log(`[Socket] ✓ Profil normalizován na: '${currentProfile}'`);
            } else {
                console.warn(`[Socket] ✗ Profil '${currentProfile}' se nepodařilo namapovat!`);
            }
            
            updateTableName();
        });


        socket.on("profileUpdate", (profil) => {
            console.log("[Socket] Profil změněn na:", profil);
            currentProfile = profil;
            
            if (Object.keys(stolyData).length > 0) {
                const availableProfiles = Object.keys(stolyData);
                const profileKey = availableProfiles.find(key => {
                    return normalizeString(key) === normalizeString(currentProfile);
                });
                
                if (profileKey) {
                    currentProfile = profileKey;
                    console.log(`[Socket] ✓ Profil normalizován na: '${currentProfile}'`);
                }
                
                updateTableName();
            } else {
                console.log(`[Socket] Data ještě nejsou dostupná, normalizace proběhne později`);
            }
        });

        
        function updateTableName() {
            const nameElement = document.querySelector(".name");
            
            if (!stolyData || Object.keys(stolyData).length === 0) {
                console.warn(`[Chyba] stolyData jsou prázdná nebo nedefinovaná!`);
                return;
            }

            if (!stolyData[currentProfile]) {
                console.warn(`[Chyba] Profil '${currentProfile}' není v datech!`);
                console.log(`[DEBUG] Dostupné profily:`, Object.keys(stolyData));
                return;
            }

            console.log(`[DEBUG] Hledám stůl ${mojeId} v profilu '${currentProfile}'`);
            console.log(`[DEBUG] Data pro profil:`, stolyData[currentProfile]);

            const table = stolyData[currentProfile].find(t => {
                const tableId = parseInt(t.id, 10);
                console.log(`[DEBUG] Porovnávám ID: ${tableId} === ${mojeId}`);
                return tableId === mojeId;
            });

            if (table && table.jmeno) {
                nameElement.textContent = table.jmeno.toUpperCase();
                console.log(`[✓ Úspěch] Nápis stolu aktualizován na: "${table.jmeno}"`);
            } else {
                console.warn(`[Chyba] Stůl ${mojeId} nenalezen v profilu '${currentProfile}'`);
            }
        }

        socket.on(`stisknutoHrac${mojeId}`, (data) => {
            console.log("!!! SIGNÁL PŘIJAT !!!");
            
            const bg = document.getElementById("bg");
            const card = document.getElementById("card");
            const status = document.getElementById("status");

            bg.classList.add("active-bg");
            card.classList.add("active-card");
            status.classList.add("active-text");
            status.innerText = "PŘIHLÁŠEN K ODPOVĚDI";

            setTimeout(() => {
                bg.classList.remove("active-bg");
                card.classList.remove("active-card");
                status.classList.remove("active-text");
                status.innerText = "PŘIPRAVEN KE HŘE";
            }, 2000);
        });
    </script>
</body>
</html>
